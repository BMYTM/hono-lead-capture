<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: one-column mobile tool — sticky event bar, two tabs (Capture / Leads), big thumb-sized controls */
:root{
  --bg:#F6F4FA; --surface:#FFFFFF; --ink:#222222; --muted:#5F5873; --line:#E1D9F0;
  --accent:#4B2E83; --accent-ink:#FFFFFF; --accent-soft:#F0EAFA; --magenta:#C0398A; --brand-word:#360B62;
  --hot:#C8331B; --hot-soft:#FBE4DF; --warm:#B26A00; --warm-soft:#FBEFD9; --cold:#3B6E8F; --cold-soft:#E1EEF5;
  --ok:#1E7A4C; --ok-soft:#DDF2E6;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14101E; --surface:#1E1830; --ink:#EEEAF6; --muted:#A79FBD; --line:#352C4D;
  --accent:#B89CF0; --accent-ink:#1A1030; --accent-soft:#2D2348; --magenta:#E77BBF; --brand-word:#DCCDF7;
  --hot:#FF8A73; --hot-soft:#3A1E1A; --warm:#F2B455; --warm-soft:#36290F; --cold:#8CC4E6; --cold-soft:#15303F;
  --ok:#6FD39E; --ok-soft:#12321F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14101E; --surface:#1E1830; --ink:#EEEAF6; --muted:#A79FBD; --line:#352C4D;
  --accent:#B89CF0; --accent-ink:#1A1030; --accent-soft:#2D2348; --magenta:#E77BBF; --brand-word:#DCCDF7;
  --hot:#FF8A73; --hot-soft:#3A1E1A; --warm:#F2B455; --warm-soft:#36290F; --cold:#8CC4E6; --cold-soft:#15303F;
  --ok:#6FD39E; --ok-soft:#12321F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}.logo .mark{display:block;color:var(--brand-word);flex:none}.logo .app{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-left:8px;border-left:1px solid var(--line)}
.grad{height:3px;margin-top:10px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--magenta))}
.who{font:500 12px var(--f-mono);color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eventrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.eventrow label{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.eventrow input{flex:1;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:10px}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 0 9px;font:600 15px var(--f-body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab .n{font:500 12px var(--f-mono);margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
section.panel{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.scan{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:12px 14px;font:600 15px var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:64px;flex-direction:column;gap:2px}
.btn.big small{font:500 12px var(--f-body);color:var(--muted)}
.btn.primary small{color:var(--accent-ink);opacity:.85}
.btn.danger{color:var(--hot);border-color:var(--hot)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.lead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink)}
.status.err{background:var(--hot-soft)}
.status.ok{background:var(--ok-soft)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
legend{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > label{font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 13px;font:500 14px var(--f-body);cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#interests .chip:first-child{border-color:var(--magenta);font-weight:600}
#interests .chip:first-child[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.temp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.temp .chip{border-radius:8px}
.temp .chip[data-v="Hot"][aria-pressed="true"]{background:var(--hot);border-color:var(--hot)}
.temp .chip[data-v="Warm"][aria-pressed="true"]{background:var(--warm);border-color:var(--warm)}
.temp .chip[data-v="Cold"][aria-pressed="true"]{background:var(--cold);border-color:var(--cold)}
.dup{font-size:13px;color:var(--warm)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.savebar .wrap{padding-block:0;display:flex;gap:10px}
.savebar .btn{flex:1}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input{flex:1 1 180px;min-width:0}
.tools select{flex:0 1 auto;width:auto}
.summary{display:flex;gap:8px;flex-wrap:wrap;font:500 13px var(--f-mono);color:var(--muted)}
.summary b{color:var(--ink);font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}
.lead{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 0;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;overflow:hidden}
.lead .stripe{align-self:stretch;margin:-12px 0;background:var(--line)}
.lead[data-t="Hot"] .stripe{background:var(--hot)} .lead[data-t="Warm"] .stripe{background:var(--warm)} .lead[data-t="Cold"] .stripe{background:var(--cold)}
.lead .main{min-width:0}
.lead .nm{font-weight:600}
.lead .co{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .meta{font:500 12px var(--f-mono);color:var(--muted);margin-top:4px}
.lead .when{font:500 12px var(--f-mono);text-align:right;color:var(--muted);white-space:nowrap}
.lead .when b{display:block;color:var(--ink);font-weight:500}
.pill{display:inline-block;font:500 11px var(--f-mono);padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font:700 18px var(--f-display);margin-bottom:4px}
.editing{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;background:var(--warm-soft);padding:8px 12px;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:500;font-size:14px;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .12s,border-color .12s}}
.pending{color:var(--warm);font:500 12px var(--f-mono)}
.okmark{color:var(--ok);font:500 12px var(--f-mono)}
.scan .wide{grid-column:1/-1;min-height:48px}
.qr{position:fixed;inset:0;z-index:30;background:rgba(10,6,20,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qr .frame{position:relative;width:min(92vw,420px);max-width:100%;aspect-ratio:1}
.qr video{width:100%;height:100%;object-fit:cover;border-radius:16px;background:#000;display:block}
.qr .frame::after{content:"";position:absolute;inset:16%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.18)}
.qr p{color:#fff;margin:0;font-size:15px;text-align:center;max-width:420px}
.qr .btn{min-width:160px}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<main class="wrap">
<section class="panel" id="panelCapture">
    
    <div class="scan">

const SCAN_URL="https://hook.us2.make.com/pnatilivtfojw191cvixpibne4nxx2b2";

const FIELDS=["name","title","company","email","phone","linkedin","country","industry","headcount","currentSystem","role","nextStep","nextDate","nextTime","timeline","notes","otherModules","office"];
const $=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let sel={interests:new Set(),temp:""};let scanned=false;
let mine=ls.get("hono_mine",[]);let queue=ls.get("hono_queue",[]);

const EVENT="PMAP Tech HR 2026";$("eventName").value=EVENT;$("eventName").readOnly=true;$("eventName").style.opacity=".75";try{localStorage.removeItem("hono_event")}catch(e){}$("country").value="Philippines";
$("myName").value=ls.get("hono_me","");
$("eventName").addEventListener("input",e=>ls.set("hono_event",e.target.value.trim()));
$("myName").addEventListener("input",e=>ls.set("hono_me",e.target.value.trim()));

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2400)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

INTERESTS.forEach(v=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=v;b.setAttribute("aria-pressed","false");b.onclick=()=>{sel.interests.has(v)?sel.interests.delete(v):sel.interests.add(v);syncChips()};$("interests").appendChild(b)});
TEMPS.forEach(v=>{const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.v=v;b.textContent=v;b.setAttribute("aria-pressed","false");b.onclick=()=>{sel.temp=sel.temp===v?"":v;syncChips()};$("temp").appendChild(b)});
[["Tomorrow",1],["In 3 days",3],["Next week",7],["In 2 weeks",14]].forEach(([l,d])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=l;b.onclick=()=>{const t=new Date();t.setDate(t.getDate()+d);$("nextDate").value=t.toISOString().slice(0,10)};$("quickDates").appendChild(b)});
function syncChips(){[...$("interests").children].forEach(b=>b.setAttribute("aria-pressed",sel.interests.has(b.textContent)));[...$("temp").children].forEach(b=>b.setAttribute("aria-pressed",sel.temp===b.dataset.v))}

function showTab(t){const cap=t==="capture";$("tabCapture").setAttribute("aria-selected",cap);$("tabLeads").setAttribute("aria-selected",!cap);$("panelCapture").hidden=!cap;$("panelLeads").hidden=cap;$("savebar").hidden=!cap;window.scrollTo(0,0);if(!cap)renderList()}
$("tabCapture").onclick=()=>showTab("capture");$("tabLeads").onclick=()=>showTab("leads");

function clearForm(){FIELDS.forEach(f=>$(f).value="");$("country").value="Philippines";sel={interests:new Set(),temp:""};syncChips();scanned=false;$("dupNote").hidden=true;$("saveErr").hidden=true;$("scanStatus").hidden=true}
$("clearBtn").onclick=clearForm;
function dupCheck(){const em=$("email").value.trim().toLowerCase(),ph=$("phone").value.replace(/\D/g,"");const d=mine.find(l=>(em&&String(l.email||"").toLowerCase()===em)||(ph.length>6&&String(l.phone||"").replace(/\D/g,"")===ph));const n=$("dupNote");if(d){n.hidden=false;n.textContent="You already saved "+(d.name||"this person")+" ("+(d.company||"")+") earlier. Saving again creates a second entry."}else n.hidden=true}
$("email").addEventListener("blur",dupCheck);$("phone").addEventListener("blur",dupCheck);

// Airtable fields
function toAirtable(l){
  const f={"Full name":l.name,"Event":EVENT,"Captured by":l.capturedBy,"Job title":l.title,"Company":l.company,"Email":l.email||undefined,"Mobile / phone":l.phone,"Office phone":l.office,"LinkedIn / website":l.linkedin,"Country":l.country||"Philippines","Industry":l.industry||undefined,"Employees":l.headcount||undefined,"Current HRMS / payroll":l.currentSystem,"Decision role":l.role||undefined,"Modules of interest":l.interests.length?l.interests:undefined,"Other modules / requirements":l.otherModules,"Lead temperature":l.temp||undefined,"Next step":l.nextStep||undefined,"Buying timeline":l.timeline||undefined,"Notes":(l.notes||"")+(l.source==="Name card scan"?"\n[Captured with card scan]":l.source==="QR scan"?"\n[Captured with QR scan]":"")};
  if(l.nextDate){f["Next meeting"]=new Date(l.nextDate+"T"+(l.nextTime||"09:00")+":00+08:00").toISOString()}
  Object.keys(f).forEach(k=>{if(f[k]===undefined||f[k]==="")delete f[k]});
  return f;
}
async function send(lead){
  const body=new URLSearchParams({json:JSON.stringify(toAirtable(lead)),id:lead.id});
  const r=await fetch(SAVE_URL,{method:"POST",body});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();if(/error/i.test(t)&&!/ok/i.test(t))throw new Error(t.slice(0,120));
}
async function flush(){
  if(!queue.length)return;
  const still=[];
  for(const lead of queue){try{await send(lead);const m=mine.find(x=>x.id===lead.id);if(m)m.sent=true}catch(e){still.push(lead)}}
  queue=still;ls.set("hono_queue",queue);ls.set("hono_mine",mine);renderList();
}
$("saveBtn").onclick=async()=>{
  const err=$("saveErr");err.hidden=true;
    const ev=EVENT,me=$("myName").value.trim();
if(!me){err.hidden=false;err.textContent="Type your own name at the top first, so we know who met this lead.";$("myName").focus();window.scrollTo(0,0);return}
  if(!$("name").value.trim()||!$("company").value.trim()){err.hidden=false;err.textContent="Name and company are required.";return}
  const lead={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),event:ev,capturedBy:me,interests:[...sel.interests],temp:sel.temp,source:scanned==="qr"?"QR scan":scanned?"Name card scan":"Manual",createdAt:Date.now(),sent:false};
  FIELDS.forEach(f=>lead[f]=$(f).value.trim());
  mine.unshift(lead);ls.set("hono_mine",mine);
  const btn=$("saveBtn");btn.disabled=true;btn.textContent="Saving…";
  try{await send(lead);lead.sent=true;ls.set("hono_mine",mine);toast("Saved: "+lead.name)}
  catch(e){queue.push(lead);ls.set("hono_queue",queue);toast("No signal. Kept on this phone and will send automatically.")}
  finally{btn.disabled=false;btn.textContent="Save lead";clearForm();renderCount();window.scrollTo(0,0)}
};

// scan
async function shrink(file){const img=await createImageBitmap(file);const s=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.8).split(",")[1]}
async function handleCard(file){
  const st=$("scanStatus");st.hidden=false;st.className="status";if(!file)return;
  try{const bmp=await createImageBitmap(file);const q=await decodeFrom(bmp,bmp.width,bmp.height,true);if(q&&isCardLink(q)){await readLink(q.trim());return}if(q&&/^(BEGIN:VCARD|MECARD:)/i.test(q.trim())&&applyQR(q)>=2)return}catch(e){}
  st.className="status";st.textContent="Reading the card… (about 5 seconds)";
  try{
    const b64=await shrink(file);
    const r=await fetch(SCAN_URL,{method:"POST",body:new URLSearchParams({image:b64})});
    const t=await r.text();
    const m=t.match(/\{[\s\S]*\}/);if(!r.ok||!m)throw new Error("bad");
    const d=JSON.parse(m[0]);let n=0;
    ["name","title","company","email","phone","office","linkedin"].forEach(k=>{if(d[k]){$(k).value=d[k];n++}});
    if(d.country&&[...$("country").options].some(o=>o.value===d.country)){$("country").value=d.country;n++}
    if(n){st.className="status ok";st.textContent="Filled "+n+" fields from the card. Check them, add interest and next step, then save.";scanned=true;dupCheck()}
    else{st.className="status err";st.textContent="Couldn't read details from that photo. Try again in better light, or type them in."}
  }catch(e){st.className="status err";st.textContent="Couldn't read the card right now. Please type the details below."}
}
$("cardCam").onchange=e=>{handleCard(e.target.files[0]);e.target.value=""};
$("cardFile").onchange=e=>{handleCard(e.target.files[0]);e.target.value=""};
// QR code capture
let qrStream=null,qrTimer=null,detector=null;const qc=document.createElement("canvas");
async function getDetector(){if(detector!==null)return detector;detector=false;if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes("qr_code"))detector=new BarcodeDetector({formats:["qr_code"]})}catch(e){}}return detector}
async function decodeFrom(src,w,h,still){const det=await getDetector();if(det){try{const r=await det.detect(src);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}}
  if(typeof jsQR==="function"&&w&&h){const s=Math.min(1,(still?1400:960)/Math.max(w,h));qc.width=Math.round(w*s);qc.height=Math.round(h*s);const x=qc.getContext("2d",{willReadFrequently:true});x.drawImage(src,0,0,qc.width,qc.height);const d=x.getImageData(0,0,qc.width,qc.height);const r=jsQR(d.data,qc.width,qc.height,{inversionAttempts:"attemptBoth"});if(r&&r.data)return r.data}
  return null}
async function openQR(){const box=$("qrBox"),v=$("qrVideo");$("qrMsg").textContent="Starting camera…";box.hidden=false;
  try{qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=qrStream;await v.play();$("qrMsg").textContent="Point the camera at the QR code on the badge or card";tickQR()}
  catch(e){$("qrMsg").textContent="Camera not available. Allow camera access for this site, or use Upload card / QR photo instead."}}
function closeQR(){clearTimeout(qrTimer);if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}$("qrVideo").srcObject=null;$("qrBox").hidden=true}
async function tickQR(){if(!qrStream)return;const v=$("qrVideo");if(v.videoWidth){const t=await decodeFrom(v,v.videoWidth,v.videoHeight,false);if(t){if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}closeQR();applyQR(t);return}}qrTimer=setTimeout(tickQR,180)}
function parseQR(t){const o={};const s=(t||"").trim();
  if(/^BEGIN:VCARD/i.test(s)){const lines=s.replace(/\r?\n[ \t]/g,"").split(/\r?\n/);
    for(const ln of lines){const i=ln.indexOf(":");if(i<0)continue;const key=ln.slice(0,i).toUpperCase(),val=ln.slice(i+1).replace(/\\,/g,",").replace(/\;/g,";").replace(/\\n/gi," ").trim();const base=key.split(";")[0].replace(/^ITEM\d+\./,"");if(!val)continue;
      if(base==="FN")o.name=val;
      else if(base==="N"&&!o.name){const p=val.split(";");o.name=[p[3],p[1],p[2],p[0],p[4]].filter(Boolean).join(" ").replace(/\s+/g," ").trim()}
      else if(base==="ORG")o.company=val.split(";").filter(Boolean).join(", ");
      else if(base==="TITLE")o.title=val;
      else if(base==="EMAIL"){if(!o.email)o.email=val}
      else if(base==="TEL"){if(/FAX/.test(key)){}else if(/CELL|MOBILE|IPHONE/.test(key))o.phone=o.phone||val;else if(/WORK|MAIN/.test(key))o.office=o.office||val;else if(!o.phone)o.phone=val;else o.office=o.office||val}
      else if(base==="URL"){if(!o.linkedin||/linkedin/i.test(val))o.linkedin=val}
      else if(base==="ADR"){const p=val.split(";");o._country=(p[6]||"").trim()}
      else if(base==="NOTE")o._note=val}}
  else if(/^MECARD:/i.test(s)){s.slice(7).split(/;(?=[A-Z\-]+:)/i).forEach(part=>{const i=part.indexOf(":");if(i<0)return;const k=part.slice(0,i).toUpperCase(),v=part.slice(i+1).replace(/;+$/,"").trim();if(!v)return;
      if(k==="N"){const p=v.split(",");o.name=((p[1]||"").trim()+" "+p[0]).trim()}else if(k==="TEL")o.phone=o.phone||v;else if(k==="EMAIL")o.email=v;else if(k==="ORG")o.company=v;else if(k==="TITLE")o.title=v;else if(k==="URL")o.linkedin=v;else if(k==="NOTE")o._note=v})}
  else if(/^mailto:/i.test(s))o.email=decodeURIComponent(s.slice(7).split("?")[0]);
  else if(/^tel:/i.test(s))o.phone=s.slice(4);
  else if(/^https?:\/\//i.test(s))o.linkedin=s;
  else{const em=s.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/);if(em)o.email=em[0];const ph=s.match(/\+?\d[\d\s\-()]{7,}\d/);if(ph)o.phone=ph[0].trim();o._note=s}
  if(o._country){const map={philippines:"Philippines",ph:"Philippines",thailand:"Thailand",th:"Thailand",indonesia:"Indonesia",id:"Indonesia",malaysia:"Malaysia",my:"Malaysia",singapore:"Singapore",sg:"Singapore",vietnam:"Vietnam","viet nam":"Vietnam",vn:"Vietnam",india:"India",in:"India"};const c=map[o._country.toLowerCase()];if(c)o.country=c}
  return o}
const LINK_URL="https://hook.us2.make.com/ht8ylyrokabksppxmbkya9o2pgim472l";
function isCardLink(t){const s=(t||"").trim();return /^https?:\/\/\S+$/i.test(s)&&!/linkedin\.com\/(in|pub)\//i.test(s)}
async function readLink(u){const st=$("scanStatus");st.hidden=false;st.className="status";st.textContent="QR link found. Opening the e-card and reading details… (about 5 seconds)";
  const nt=$("notes");const addNote=()=>{if(!nt.value.includes(u))nt.value=(nt.value?nt.value+"\n":"")+"QR link: "+u};
  try{const r=await fetch(LINK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u})});const tx=await r.text();if(!r.ok)throw new Error("HTTP "+r.status);
    const d=JSON.parse(tx.slice(tx.indexOf("{"),tx.lastIndexOf("}")+1));let n=0;
    ["name","title","company","email","phone","office","linkedin"].forEach(k=>{const v=(d[k]||"").trim();if(v){$(k).value=v;n++}});
    if(d.country&&d.country!=="Other")$("country").value=d.country;addNote();
    if(n){st.className="status ok";st.textContent="Filled "+n+" field"+(n>1?"s":"")+" from the e-card link. Check them, add interest and next step, then save.";scanned="qr";dupCheck()}
    else{st.className="status";st.textContent="Opened the QR link but found no contact details. The link is saved in Notes; please type the details."}
    return n}
  catch(e){addNote();st.className="status";st.textContent="Could not read the e-card link (check signal). The link is saved in Notes; type the details or try again.";return 0}}
function applyQR(t){if(isCardLink(t))return readLink(t.trim());const d=parseQR(t);const st=$("scanStatus");st.hidden=false;let n=0;
  ["name","title","company","email","phone","office","linkedin"].forEach(k=>{if(d[k]){$(k).value=d[k];n++}});
  if(d.country)$("country").value=d.country;
  if(d._note){const nt=$("notes");nt.value=(nt.value?nt.value+"\n":"")+"QR: "+d._note.slice(0,300)}
  if(n){st.className="status ok";st.textContent="Filled "+n+" field"+(n>1?"s":"")+" from the QR code. Check them, add interest and next step, then save.";scanned="qr";dupCheck()}
  else{st.className="status";st.textContent="QR code read, but it had no contact details. Its text is saved in Notes; please type the details."}
  return n}
$("qrBtn").onclick=openQR;$("qrClose").onclick=closeQR;


// list
function fmtDate(d){if(!d)return"";return new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function renderCount(){$("countBadge").textContent=mine.length}
function renderList(){
  renderCount();
  const c={Hot:0,Warm:0,Cold:0};mine.forEach(l=>{if(c[l.temp]!=null)c[l.temp]++});
  $("summary").innerHTML=`<span><b>${mine.length}</b> leads</span><span>·</span><span><b>${c.Hot}</b> hot</span><span><b>${c.Warm}</b> warm</span><span><b>${c.Cold}</b> cold</span>`;
  const rb=$("retryBox");rb.hidden=!queue.length;$("retryText").textContent=queue.length+" lead(s) waiting to send.";
  const list=$("list");
  if(!mine.length){list.innerHTML='<div class="empty"><strong>No leads yet</strong>Leads you save on the Capture tab show up here.</div>';return}
  list.innerHTML=mine.map(l=>`<div class="lead" data-t="${esc(l.temp)}" style="cursor:default"><span class="stripe"></span><span class="main"><div class="nm">${esc(l.name)}</div><div class="co">${esc([l.title,l.company].filter(Boolean).join(" · "))}</div><div class="meta">${(l.interests||[]).slice(0,3).map(i=>`<span class="pill">${esc(i)}</span>`).join("")}</div><div class="${l.sent?"okmark":"pending"}">${l.sent?"Saved to team list":"Waiting to send"}</div></span><span class="when">${l.nextDate?`<b>${esc(fmtDate(l.nextDate))}</b>${esc(l.nextStep||"Meeting")}`:esc(l.temp||"")}</span></div>`).join("");
}
$("retryBtn").onclick=flush;
window.addEventListener("online",flush);
setInterval(flush,30000);
renderCount();flush();

</script>
